name: Auto-Sync System Documentation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily 6AM UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild skill and agent index
        run: |
          python3 scripts/rebuild-index.py

      - name: Update badge counts in README
        run: |
          SKILL_COUNT=$(ls skills/ | wc -l | tr -d ' ')
          AGENT_COUNT=$(ls agents/ | wc -l | tr -d ' ')
          echo "Skills: $SKILL_COUNT | Agents: $AGENT_COUNT"

      - name: Commit if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action (auto-sync)"
          git add -A
          git diff --staged --quiet || git commit -m "auto: rebuild skill/agent index $(date +%Y-%m-%d)"
          git push
